<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<title>Sales Assistant: Guided Workflow Layer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
/* ============================================================
   FLUENT 2 DESIGN TOKENS
   Mirrors the token set Copilot Studio / M365 Copilot are built
   on, so this layer sits natively alongside stock Copilot UI.
   ============================================================ */
:root{
  /* Neutrals — light */
  --bg-canvas:#f5f5f5;
  --bg-surface:#ffffff;
  --bg-surface-alt:#fafafa;
  --bg-sidebar:#f0f0f0;
  --bg-hover:#f0f0f0;
  --bg-pressed:#e0e0e0;
  --bg-selected:#ebf3fc;

  --fg-1:#242424;
  --fg-2:#424242;
  --fg-3:#616161;
  --fg-4:#707070;
  --fg-disabled:#bdbdbd;

  --stroke-1:#d1d1d1;
  --stroke-2:#e0e0e0;
  --stroke-focus:#0f6cbd;

  /* Brand — Copilot Studio blue */
  --brand:#0f6cbd;
  --brand-hover:#115ea3;
  --brand-pressed:#0c3b5e;
  --brand-fg:#0f6cbd;
  --brand-subtle:#ebf3fc;
  --brand-subtle-hover:#dcecfa;

  /* Agent identity — Copilot's indigo/violet */
  --agent-1:#8b5cf6;
  --agent-2:#6366f1;

  /* Accent tints for workflow icons (light) */
  --t-purple-bg:#f0ebfc; --t-purple-fg:#7c3aed;
  --t-blue-bg:#ebf3fc;   --t-blue-fg:#0f6cbd;
  --t-teal-bg:#e0f5f3;   --t-teal-fg:#0b6a61;
  --t-green-bg:#e4f6ed;  --t-green-fg:#0e7040;
  --t-orange-bg:#fdf1e3; --t-orange-fg:#9a5b06;
  --t-pink-bg:#fceef5;   --t-pink-fg:#b4227e;

  --warn-bg:#fdf1e3; --warn-fg:#8a4d05; --warn-stroke:#f0d9b8;

  /* Fluent corner radii — notably tighter than generic web UI */
  --r-sm:2px; --r-md:4px; --r-lg:6px; --r-xl:8px; --r-circle:9999px;

  /* Fluent elevation */
  --shadow-2:0 1px 2px rgba(0,0,0,.14), 0 0 2px rgba(0,0,0,.12);
  --shadow-4:0 2px 4px rgba(0,0,0,.14), 0 0 2px rgba(0,0,0,.12);
  --shadow-8:0 4px 8px rgba(0,0,0,.14), 0 0 2px rgba(0,0,0,.12);
  --shadow-16:0 8px 16px rgba(0,0,0,.14), 0 0 2px rgba(0,0,0,.12);
  --shadow-28:0 14px 28px rgba(0,0,0,.24), 0 0 8px rgba(0,0,0,.20);

  --font:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif;
  --font-display:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,sans-serif;
}

[data-theme="dark"]{
  --bg-canvas:#141414;
  --bg-surface:#292929;
  --bg-surface-alt:#1f1f1f;
  --bg-sidebar:#1f1f1f;
  --bg-hover:#383838;
  --bg-pressed:#424242;
  --bg-selected:#0c3b5e;

  --fg-1:#ffffff;
  --fg-2:#d6d6d6;
  --fg-3:#adadad;
  --fg-4:#949494;
  --fg-disabled:#5c5c5c;

  --stroke-1:#525252;
  --stroke-2:#3d3d3d;
  --stroke-focus:#479ef5;

  --brand:#115ea3;
  --brand-hover:#0f6cbd;
  --brand-pressed:#0c3b5e;
  --brand-fg:#479ef5;
  --brand-subtle:#0c3b5e;
  --brand-subtle-hover:#0f548c;

  --agent-1:#a78bfa;
  --agent-2:#818cf8;

  --t-purple-bg:#2d2445; --t-purple-fg:#c4b5fd;
  --t-blue-bg:#0c3b5e;   --t-blue-fg:#7cc0f5;
  --t-teal-bg:#123b38;   --t-teal-fg:#6fd1c7;
  --t-green-bg:#123524;  --t-green-fg:#6fcf97;
  --t-orange-bg:#3d2c14; --t-orange-fg:#e8b06a;
  --t-pink-bg:#3d1f31;   --t-pink-fg:#f0a0cd;

  --warn-bg:#3d2c14; --warn-fg:#e8b06a; --warn-stroke:#5c451f;

  --shadow-2:0 1px 2px rgba(0,0,0,.28), 0 0 2px rgba(0,0,0,.24);
  --shadow-4:0 2px 4px rgba(0,0,0,.28), 0 0 2px rgba(0,0,0,.24);
  --shadow-8:0 4px 8px rgba(0,0,0,.28), 0 0 2px rgba(0,0,0,.24);
  --shadow-16:0 8px 16px rgba(0,0,0,.28), 0 0 2px rgba(0,0,0,.24);
  --shadow-28:0 14px 28px rgba(0,0,0,.4), 0 0 8px rgba(0,0,0,.32);
}

*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{
  font-family:var(--font);
  font-size:14px;
  line-height:20px;
  color:var(--fg-1);
  background:var(--bg-canvas);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--stroke-focus);outline-offset:2px;border-radius:var(--r-md);}
:focus:not(:focus-visible){outline:none;}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}
}

.app{display:flex;height:100vh;overflow:hidden;background:var(--bg-canvas);}

/* ================= SIDEBAR ================= */
.sidebar{
  width:260px;flex-shrink:0;background:var(--bg-sidebar);
  border-right:1px solid var(--stroke-2);
  display:flex;flex-direction:column;padding:12px 8px;overflow-y:auto;
}
.seg{display:flex;background:var(--bg-pressed);border-radius:var(--r-lg);padding:2px;margin:0 4px 12px;}
.seg button{
  flex:1;border:none;background:transparent;padding:5px 0;border-radius:var(--r-md);
  font-size:13px;font-weight:600;color:var(--fg-3);cursor:pointer;
}
.seg button[aria-selected="true"]{background:var(--bg-surface);color:var(--fg-1);box-shadow:var(--shadow-2);}

.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border:none;
  background:transparent;border-radius:var(--r-md);font-size:14px;color:var(--fg-2);
  cursor:pointer;text-align:left;
}
.nav-item:hover{background:var(--bg-hover);}
.nav-item svg{width:16px;height:16px;flex-shrink:0;color:var(--fg-3);}

.nav-group{
  display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;
  color:var(--fg-3);padding:0 8px;margin:14px 0 4px;
}
.nav-group svg{width:12px;height:12px;}

.agent-row{
  display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border:none;
  background:transparent;border-radius:var(--r-md);font-size:14px;color:var(--fg-2);
  cursor:pointer;text-align:left;
}
.agent-row:hover{background:var(--bg-hover);}
.agent-row[aria-current="true"]{background:var(--brand);color:#fff;font-weight:600;}
[data-theme="dark"] .agent-row[aria-current="true"]{background:var(--brand);color:#fff;}
.agent-glyph{
  width:22px;height:22px;border-radius:var(--r-md);flex-shrink:0;
  background:var(--tint-bg);color:var(--tint-fg);
  display:flex;align-items:center;justify-content:center;
}
.agent-glyph svg{width:13px;height:13px;}

.hist{
  display:block;width:100%;padding:6px 8px;border:none;background:transparent;
  border-radius:var(--r-md);font-size:14px;color:var(--fg-2);cursor:pointer;text-align:left;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.hist:hover{background:var(--bg-hover);}

/* ================= MAIN ================= */
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg-surface);}

.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:0 16px;height:48px;flex-shrink:0;border-bottom:1px solid var(--stroke-2);
}
.topbar-l{display:flex;align-items:center;gap:8px;min-width:0;}
.topbar-title{font-size:14px;font-weight:600;color:var(--fg-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-r{display:flex;align-items:center;gap:2px;}

.ibtn{
  width:32px;height:32px;border-radius:var(--r-md);border:none;background:transparent;
  color:var(--fg-3);display:flex;align-items:center;justify-content:center;cursor:pointer;
  flex-shrink:0;transition:background .1s;
}
.ibtn:hover{background:var(--bg-hover);color:var(--fg-1);}
.ibtn:active{background:var(--bg-pressed);}
.ibtn svg{width:16px;height:16px;}

.stage{flex:1;display:flex;flex-direction:column;min-height:0;}

/* ================= LANDING ================= */
.landing{
  flex:1;overflow-y:auto;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:32px 20px;
}
.landing-col{width:100%;max-width:680px;display:flex;flex-direction:column;align-items:center;}

.hero-mark{
  width:48px;height:48px;border-radius:var(--r-xl);margin-bottom:12px;
  background:linear-gradient(135deg,var(--agent-1),var(--agent-2));
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-4);
}
.hero-mark svg{width:24px;height:24px;color:#fff;}
.hero-title{
  font-family:var(--font-display);font-size:28px;line-height:36px;font-weight:600;
  margin:0 0 2px;letter-spacing:-.01em;
}
.hero-sub{font-size:14px;color:var(--fg-3);margin:0 0 24px;}
.hero-sub a{color:var(--brand-fg);text-decoration:none;font-weight:600;}
.hero-sub a:hover{text-decoration:underline;}

/* ================= COMPOSER ================= */
.composer-wrap{width:100%;position:relative;}
.composer{
  background:var(--bg-surface);border:1px solid var(--stroke-1);border-radius:var(--r-xl);
  padding:10px 12px 8px;box-shadow:var(--shadow-2);transition:border-color .12s, box-shadow .12s;
}
.composer:focus-within{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand), var(--shadow-2);}
.composer textarea{
  width:100%;border:none;outline:none;resize:none;background:transparent;
  font-family:inherit;font-size:14px;line-height:20px;color:var(--fg-1);
  min-height:20px;max-height:160px;padding:0;
}
.composer textarea::placeholder{color:var(--fg-4);}

.composer-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;}
.composer-bar-l,.composer-bar-r{display:flex;align-items:center;gap:2px;}

.wf-chip{
  display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;
  border:1px solid var(--stroke-1);background:var(--bg-surface);color:var(--fg-2);
  border-radius:var(--r-circle);font-size:12px;font-weight:600;cursor:pointer;
  transition:background .1s,border-color .1s,color .1s;margin-left:4px;
}
.wf-chip:hover{background:var(--bg-hover);border-color:var(--stroke-1);color:var(--fg-1);}
.wf-chip[aria-expanded="true"]{background:var(--brand-subtle);border-color:var(--brand);color:var(--brand-fg);}
.wf-chip svg{width:14px;height:14px;}

.send{
  width:32px;height:32px;border-radius:var(--r-md);border:none;cursor:pointer;
  background:transparent;color:var(--fg-disabled);
  display:flex;align-items:center;justify-content:center;transition:background .1s,color .1s;
}
.send[data-ready="true"]{background:var(--brand);color:#fff;}
.send[data-ready="true"]:hover{background:var(--brand-hover);}
.send svg{width:16px;height:16px;}

/* ================= GUIDED PICKER ================= */
.picker-inline{width:100%;margin-top:20px;}
.picker-head{
  display:flex;align-items:center;justify-content:space-between;
  font-size:13px;font-weight:600;color:var(--fg-3);margin-bottom:8px;padding:0 2px;
}

.wf-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  max-height:352px;overflow-y:auto;padding:3px;
}

/* ---- Workflow card ----
   Each card carries its workflow's tint as a variable, so a faint corner
   wash, the glyph, the hover border and the go-arrow all read as one family. */
.wf-card{
  position:relative;overflow:hidden;text-align:left;cursor:pointer;
  padding:14px;background:var(--bg-surface);
  border:1px solid var(--stroke-2);border-radius:var(--r-xl);
  transition:transform .16s cubic-bezier(.16,1,.3,1),box-shadow .16s,border-color .16s;
}
.wf-card::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(125% 95% at 100% 0%, var(--tint-bg) 0%, transparent 58%);
  opacity:.5;transition:opacity .2s;
}
.wf-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-8);border-color:var(--tint-fg);}
.wf-card:hover::before{opacity:1;}
.wf-card:active{transform:translateY(0);box-shadow:var(--shadow-2);transition-duration:.06s;}
.wf-card.is-add{border-style:dashed;border-color:var(--stroke-1);}
.wf-card.is-add::before{opacity:0;}
.wf-card.is-add:hover{border-style:dashed;}

.wf-top{
  position:relative;display:flex;align-items:flex-start;justify-content:space-between;
  gap:8px;margin-bottom:10px;
}
.wf-glyph{
  width:30px;height:30px;border-radius:var(--r-lg);flex-shrink:0;
  background:var(--tint-bg);color:var(--tint-fg);
  display:flex;align-items:center;justify-content:center;
}
.wf-glyph svg{width:16px;height:16px;}

.wf-go{
  flex-shrink:0;width:16px;height:16px;color:var(--tint-fg);
  opacity:0;transform:translate(-4px,2px);transition:opacity .16s,transform .16s;
}
.wf-card:hover .wf-go{opacity:1;transform:none;}

.wf-name{
  position:relative;display:block;font-size:13px;line-height:18px;font-weight:600;
  color:var(--fg-1);margin:0 0 3px;
}
.wf-desc{position:relative;display:block;font-size:12px;line-height:16px;color:var(--fg-3);margin:0;}

.badge{
  flex-shrink:0;font-size:9px;line-height:15px;font-weight:700;letter-spacing:.04em;
  padding:0 5px;border-radius:var(--r-sm);white-space:nowrap;
  background:var(--warn-bg);color:var(--warn-fg);border:1px solid var(--warn-stroke);
}

/* Tints — carry variables only, so any container can inherit a workflow's identity */
.tint-purple{--tint-bg:var(--t-purple-bg);--tint-fg:var(--t-purple-fg);}
.tint-blue  {--tint-bg:var(--t-blue-bg);  --tint-fg:var(--t-blue-fg);}
.tint-teal  {--tint-bg:var(--t-teal-bg);  --tint-fg:var(--t-teal-fg);}
.tint-green {--tint-bg:var(--t-green-bg); --tint-fg:var(--t-green-fg);}
.tint-orange{--tint-bg:var(--t-orange-bg);--tint-fg:var(--t-orange-fg);}
.tint-pink  {--tint-bg:var(--t-pink-bg);  --tint-fg:var(--t-pink-fg);}

/* ---- Action panel ----
   Inherits the tint of the workflow you came from: header wash, hover rail
   and arrow all carry that colour, so you always know where you are. */
.actions{
  background:var(--bg-surface);border:1px solid var(--stroke-2);
  border-radius:var(--r-xl);box-shadow:var(--shadow-2);overflow:hidden;
}
.actions-head{
  display:flex;align-items:center;gap:10px;padding:11px 12px;
  border-bottom:1px solid var(--stroke-2);
  background:linear-gradient(90deg,var(--tint-bg) 0%,transparent 72%);
}
.actions-head .wf-glyph{width:26px;height:26px;border-radius:var(--r-md);}
.actions-head .wf-glyph svg{width:14px;height:14px;}
.actions-title{font-size:13px;line-height:18px;font-weight:600;color:var(--fg-1);}
.actions-count{
  margin-left:auto;font-size:11px;font-weight:600;color:var(--fg-4);
  padding-right:2px;white-space:nowrap;
}

.actions-list{
  display:flex;flex-direction:column;gap:1px;
  padding:6px;max-height:300px;overflow-y:auto;
}
.act{
  position:relative;display:flex;align-items:center;gap:12px;
  width:100%;text-align:left;padding:11px 12px 11px 14px;
  border:none;background:transparent;border-radius:var(--r-lg);
  cursor:pointer;transition:background .12s;
}
/* accent rail grows out of the left edge on hover */
.act::before{
  content:'';position:absolute;left:4px;top:50%;transform:translateY(-50%);
  width:2px;height:0;border-radius:var(--r-circle);background:var(--tint-fg);
  transition:height .18s cubic-bezier(.16,1,.3,1);
}
.act:hover{background:var(--bg-hover);}
.act:hover::before{height:56%;}
.act:active{background:var(--bg-pressed);}

.act-body{flex:1;min-width:0;}
.act-t{display:block;font-size:13px;line-height:18px;font-weight:600;color:var(--fg-1);}
.act-d{display:block;font-size:12px;line-height:16px;color:var(--fg-3);margin-top:2px;}

/* arrow dropping into a field — literally what clicking does */
.act-go{
  flex-shrink:0;width:16px;height:16px;color:var(--fg-4);
  opacity:0;transform:translateX(-4px);transition:opacity .16s,transform .16s,color .16s;
}
.act:hover .act-go{opacity:1;transform:none;color:var(--tint-fg);}

.act.is-muted .act-t{color:var(--fg-3);font-weight:500;}
.act.is-muted .act-go{display:none;}

/* Popover variant (mid-conversation) */
.popover{
  position:absolute;bottom:calc(100% + 8px);left:0;right:0;z-index:30;
  background:var(--bg-surface);border:1px solid var(--stroke-1);
  border-radius:var(--r-xl);box-shadow:var(--shadow-28);overflow:hidden;
  animation:pop .12s ease-out;
}
@keyframes pop{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
.popover-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 8px 8px 12px;border-bottom:1px solid var(--stroke-2);
  font-size:13px;font-weight:600;color:var(--fg-2);
}
.popover-body{padding:8px;max-height:320px;overflow-y:auto;}
.popover-body .wf-grid{max-height:none;overflow:visible;grid-template-columns:repeat(3,1fr);padding:0;}
.popover-body .actions{border:none;box-shadow:none;border-radius:0;}
.popover-body .actions-list{max-height:264px;padding:6px 0 0;}

/* ================= TRANSCRIPT ================= */
.transcript{flex:1;overflow-y:auto;padding:24px 20px 8px;}
.thread{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:20px;}

.turn-user{align-self:flex-end;max-width:82%;}
.bubble{
  background:var(--bg-selected);border:1px solid var(--stroke-2);
  border-radius:var(--r-xl);padding:10px 14px;font-size:14px;line-height:20px;
  color:var(--fg-1);white-space:pre-wrap;word-break:break-word;
}
[data-theme="dark"] .bubble{border-color:transparent;}

.turn-agent{display:flex;gap:12px;max-width:100%;}
.turn-glyph{
  width:28px;height:28px;border-radius:var(--r-lg);flex-shrink:0;margin-top:1px;
  background:linear-gradient(135deg,var(--agent-1),var(--agent-2));
  display:flex;align-items:center;justify-content:center;
}
.turn-glyph svg{width:15px;height:15px;color:#fff;}
.turn-body{min-width:0;flex:1;}
.turn-name{font-size:13px;font-weight:600;color:var(--fg-1);margin-bottom:3px;}
.turn-text{font-size:14px;line-height:21px;color:var(--fg-1);word-break:break-word;}
.turn-text strong{font-weight:600;}
.turn-text em{color:var(--fg-3);font-style:italic;}

.turn-tools{display:flex;gap:1px;margin-top:8px;margin-left:-6px;}
.turn-tools .ibtn{width:28px;height:28px;}
.turn-tools .ibtn svg{width:14px;height:14px;}

.dots{display:flex;gap:4px;align-items:center;height:21px;}
.dots i{
  width:6px;height:6px;border-radius:50%;background:var(--fg-4);
  animation:pulse 1.3s ease-in-out infinite;
}
.dots i:nth-child(2){animation-delay:.18s;}
.dots i:nth-child(3){animation-delay:.36s;}
@keyframes pulse{0%,70%,100%{opacity:.25;transform:scale(.85);}35%{opacity:1;transform:scale(1);}}

.composer-dock{flex-shrink:0;padding:8px 20px 20px;background:var(--bg-surface);}
.composer-dock-inner{max-width:680px;margin:0 auto;position:relative;}

.footnote{
  text-align:center;font-size:11px;line-height:16px;color:var(--fg-4);
  margin-top:8px;max-width:680px;margin-left:auto;margin-right:auto;
}

/* ================= SCROLLBARS ================= */
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--stroke-1);border-radius:var(--r-circle);border:3px solid transparent;background-clip:content-box;}
::-webkit-scrollbar-thumb:hover{background:var(--fg-4);background-clip:content-box;}
::-webkit-scrollbar-track{background:transparent;}

/* ================= RESPONSIVE ================= */
@media (max-width:1000px){
  .wf-grid,.popover-body .wf-grid{grid-template-columns:repeat(2,1fr);}
}
@media (max-width:820px){
  .sidebar{display:none;}
}
@media (max-width:560px){
  .wf-grid,.popover-body .wf-grid{grid-template-columns:1fr;}
  .hero-title{font-size:24px;line-height:30px;}
  .transcript{padding:16px 12px 8px;}
  .composer-dock{padding:8px 12px 16px;}
  .landing{padding:20px 12px;}
}
</style>
</head>
<body>
<div class="app">

  <!-- ============ SIDEBAR ============ -->
  <nav class="sidebar" aria-label="Navigation">
    <div class="seg" role="tablist">
      <button role="tab" aria-selected="true">Chat</button>
      <button role="tab" aria-selected="false">Cowork</button>
    </div>

/* =========================================================
   STATE
   ========================================================= */
const state = {
  theme: window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light',
  started: false,
  messages: [],
  draft: '',
  pendingResponse: null,
  picker: { open:false, view:'workflows', workflowId:null }
};

const esc = str => String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* =========================================================
   STATIC CHROME
   ========================================================= */
function paintChrome(){
  document.documentElement.setAttribute('data-theme', state.theme);

  document.getElementById('nav-new').innerHTML     = s('compose') + '<span>New chat</span>';
  document.getElementById('nav-search').innerHTML  = s('search')  + '<span>Search</span>';
  document.getElementById('nav-library').innerHTML = s('book')    + '<span>Library</span>';
  document.getElementById('grp-agents').innerHTML  = s('chevron') + '<span>Agents</span>';
  document.getElementById('grp-chats').innerHTML   = s('chevron') + '<span>Chats</span>';
  document.getElementById('btn-back').innerHTML    = s('back');

  const agents = [
    {n:'Researcher',   g:'search',    t:'tint-blue'},
    {n:'Analyst',      g:'spark',     t:'tint-green'},
    {n:'Planner Agent',g:'calendar',  t:'tint-orange'},
    {n:'Sales Assistant', g:'briefcase', t:'tint-purple', cur:true}
  ];
  document.getElementById('agent-list').innerHTML = agents.map(a => `
    <button class="agent-row" ${a.cur?'aria-current="true"':''}>
      <span class="agent-glyph ${a.cur?'':a.t}" ${a.cur?'style="background:rgba(255,255,255,.22);color:#fff"':''}>${s(a.g)}</span>
      <span>${a.n}</span>
    </button>`).join('');

  const chats = ['Employee Locations and Roles','Prompt library Project Plan','MVP Launch Scope Definition','Arrange interviews with Primary…'];
  document.getElementById('chat-list').innerHTML = chats.map(c => `<button class="hist">${c}</button>`).join('');

  document.getElementById('topbar-actions').innerHTML = `
    <button class="ibtn" id="btn-theme" aria-label="Switch to ${state.theme==='light'?'dark':'light'} mode" title="Switch to ${state.theme==='light'?'dark':'light'} mode">
      ${s(state.theme==='light'?'moon':'sun')}
    </button>
    <button class="ibtn" aria-label="Comments">${s('comment')}</button>
    <button class="ibtn" aria-label="Save">${s('bookmark')}</button>
    <button class="ibtn" aria-label="Share">${s('share')}</button>
    <button class="ibtn" aria-label="Manage access">${s('people')}</button>`;

  document.getElementById('btn-theme').addEventListener('click', toggleTheme);
}

function toggleTheme(){
  state.theme = state.theme === 'light' ? 'dark' : 'light';
  paintChrome();
}

/* =========================================================
   PICKER
   ========================================================= */
/* Tint lives on the parent card/panel, so the glyph just inherits it. */
function glyph(wf, cls='wf-glyph'){
  return `<span class="${cls}">${s(wf.icon)}</span>`;
}

function pickerBody(){
  if(state.picker.view === 'workflows'){
    return `<div class="wf-grid" role="list">` + WORKFLOWS.map(wf => `
      <button class="wf-card tint-${wf.color}${wf.addCard?' is-add':''}" role="listitem"
              onclick="openWorkflow('${wf.id}')"
              aria-label="${esc(wf.label)}${wf.pending?' — actions pending':''}">
        <span class="wf-top">
          ${glyph(wf)}
          ${wf.pending ? '<span class="badge">PENDING</span>' : `<span class="wf-go">${s('go')}</span>`}
        </span>
        <span class="wf-name">${wf.label}</span>
        <span class="wf-desc">${wf.desc}</span>
      </button>`).join('') + `</div>`;
  }
  const wf = WORKFLOWS.find(w => w.id === state.picker.workflowId);
  const n = wf.actions.length;
  return `
    <div class="actions tint-${wf.color}">
      <div class="actions-head">
        <button class="ibtn" onclick="backToWorkflows()" aria-label="Back to workflows"
                style="width:26px;height:26px">${s('back')}</button>
        ${glyph(wf)}
        <span class="actions-title">${wf.label}</span>
        <span class="actions-count">${wf.pending ? 'Awaiting definition' : n + (n===1?' action':' actions')}</span>
      </div>
      <div class="actions-list">
        ${wf.actions.map((a,i) => `
          <button class="act${wf.pending?' is-muted':''}" onclick="chooseAction('${wf.id}',${i})">
            <span class="act-body">
              <span class="act-t">${a.title}</span>
              <span class="act-d">${a.desc}</span>
            </span>
            <span class="act-go">${s('arrow')}</span>
          </button>`).join('')}
      </div>
    </div>`;
}

/* =========================================================
   COMPOSER
   ========================================================= */
function composer(){
  const ready = state.draft.trim().length > 0;
  return `
    <div class="composer-wrap">
      ${state.started && state.picker.open ? `
        <div class="popover" role="dialog" aria-label="Choose a workflow">
          <div class="popover-head">
            <span>${state.picker.view==='workflows' ? 'Workflows' : 'Choose an action'}</span>
            <button class="ibtn" onclick="closePicker()" aria-label="Close">${s('close')}</button>
          </div>
          <div class="popover-body">${pickerBody()}</div>
        </div>` : ''}
      <div class="composer">
        <textarea id="ta" rows="1" placeholder="Message Sales Assistant"
          aria-label="Message Sales Assistant"
          oninput="onInput(this)" onkeydown="onKey(event)">${esc(state.draft)}</textarea>
        <div class="composer-bar">
          <div class="composer-bar-l">
            <button class="ibtn" aria-label="Add attachment">${s('plus')}</button>
            ${state.started ? `
              <button class="wf-chip" onclick="togglePicker()"
                      aria-expanded="${state.picker.open}" aria-label="Switch workflow">
                ${s('grid')}<span>Switch workflow</span>
              </button>` : ''}
          </div>
          <div class="composer-bar-r">
            <button class="ibtn" aria-label="Dictate">${s('mic')}</button>
            <button class="send" data-ready="${ready}" onclick="send()" aria-label="Send message">${s('send')}</button>
          </div>
        </div>
      </div>
    </div>`;
}

/* =========================================================
   VIEWS
   ========================================================= */
function landing(){
  return `
    <div class="landing">
      <div class="landing-col">
        <div class="hero-mark">${s('bot')}</div>
        <h1 class="hero-title">Sales Assistant</h1>
        <p class="hero-sub">Created by <a href="#">the enablement team</a></p>
        ${composer()}
        <div class="picker-inline">
          <div class="picker-head">
            <span>${state.picker.view==='workflows' ? 'What are you working on today?' : 'Choose an action'}</span>
          </div>
          ${pickerBody()}
        </div>
      </div>
    </div>`;
}

function transcript(){
  return `
    <div class="transcript" id="scroll">
      <div class="thread">
        ${state.messages.map(m => {
          if(m.role === 'user')
            return `<div class="turn-user"><div class="bubble">${esc(m.text)}</div></div>`;
          if(m.role === 'typing')
            return `<div class="turn-agent"><div class="turn-glyph">${s('bot')}</div>
              <div class="turn-body"><div class="turn-name">Sales Assistant</div>
              <div class="dots" role="status" aria-label="Sales Assistant is responding"><i></i><i></i><i></i></div></div></div>`;
          return `<div class="turn-agent">
            <div class="turn-glyph">${s('bot')}</div>
            <div class="turn-body">
              <div class="turn-name">Sales Assistant</div>
              <div class="turn-text">${m.html}</div>
              <div class="turn-tools">
                <button class="ibtn" aria-label="Copy">${s('copy')}</button>
                <button class="ibtn" aria-label="Good response">${s('like')}</button>
                <button class="ibtn" aria-label="Bad response">${s('dislike')}</button>
                <button class="ibtn" aria-label="Edit">${s('edit')}</button>
                <button class="ibtn" aria-label="More actions">${s('more')}</button>
              </div>
            </div></div>`;
        }).join('')}
      </div>
    </div>
    <div class="composer-dock">
      <div class="composer-dock-inner">${composer()}</div>
      <p class="footnote">Guided workflows are a prototype layer. AI responses can be inaccurate — verify before sending to customers.</p>
    </div>`;
}

function render(){
  document.getElementById('stage').innerHTML = state.started ? transcript() : landing();
  const ta = document.getElementById('ta');
  if(ta){
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 160) + 'px';
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
  }
  const sc = document.getElementById('scroll');
  if(sc) sc.scrollTop = sc.scrollHeight;
}

/* =========================================================
   ACTIONS
   ========================================================= */
function openWorkflow(id){
  const wf = WORKFLOWS.find(w => w.id === id);
  if(wf.addCard){
    state.draft = 'A workflow my team needs that is missing: ';
    state.pendingResponse = '<em>Noted. In a live build this would be routed to the enablement team for review, the same way the current workflow document collects requests.</em>';
    state.picker.open = false;
    render();
    return;
  }
  state.picker.view = 'actions';
  state.picker.workflowId = id;
  render();
}
function backToWorkflows(){
  state.picker.view = 'workflows';
  state.picker.workflowId = null;
  render();
}
function chooseAction(wfId, i){
  const a = WORKFLOWS.find(w => w.id === wfId).actions[i];
  state.draft = a.prompt;
  state.pendingResponse = a.response;
  state.picker.open = false;
  state.picker.view = 'workflows';
  state.picker.workflowId = null;
  render();
}
function togglePicker(){
  state.picker.open = !state.picker.open;
  state.picker.view = 'workflows';
  state.picker.workflowId = null;
  render();
}
function closePicker(){
  state.picker.open = false;
  render();
}
function onInput(el){
  state.draft = el.value;
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
  const btn = el.closest('.composer').querySelector('.send');
  if(btn) btn.dataset.ready = state.draft.trim().length > 0;
}
function onKey(e){
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
}
function send(){
  const text = state.draft.trim();
  if(!text) return;
  const reply = state.pendingResponse ||
    'I can work with that. For a more structured path, open <strong>Switch workflow</strong> below and pick the task you\'re doing — or keep typing and I\'ll take it from here.';
  state.pendingResponse = null;
  state.messages.push({role:'user', text});
  state.draft = '';
  state.started = true;
  state.picker.open = false;
  render();
  state.messages.push({role:'typing'});
  render();
  setTimeout(() => {
    state.messages.pop();
    state.messages.push({role:'agent', html: reply});
    render();
  }, 750);
}

/* Escape closes the picker */
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && state.picker.open){ closePicker(); }
});

/* Follow OS theme if the user hasn't overridden it this session */
if(window.matchMedia){
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', e => {
    state.theme = e.matches ? 'dark' : 'light';
    paintChrome();
  });
}

paintChrome();
render();
</script>
